[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "data", "docs/requirements"]

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["venv", "tests"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "pyperclip.*", "redis.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src", "config"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
